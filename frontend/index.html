<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO Autopilot</title>
<style>
body{margin:0;background:#071321;color:#eef6ff;font-family:system-ui,Tahoma,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.nav{display:flex;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo b{color:#55a8ff}.hero{text-align:center;padding:65px 10px 35px}.hero h1{font-size:46px;margin:0 0 14px}.hero span{color:#55a8ff}.hero p{color:#9bb0c4}.search{display:flex;max-width:760px;margin:28px auto;background:#0d2034;border:1px solid #29445e;padding:6px;border-radius:14px}.search input{flex:1;background:none;border:0;outline:0;color:white;padding:15px;direction:ltr;font-size:16px}.btn{background:#55a8ff;border:0;border-radius:10px;padding:0 24px;font-weight:800}.card{background:#0d1e31;border:1px solid #203b55;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:240px 1fr;gap:16px}.score{text-align:center}.circle{width:145px;height:145px;border-radius:50%;background:conic-gradient(#35d39a calc(var(--score)*1%),#19334c 0);margin:15px auto;display:grid;place-items:center}.circle div{background:#091728;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#10263d;padding:15px;border-radius:10px}.metric b{display:block;font-size:24px;margin-top:5px}.muted{color:#91a8bd}.row{padding:14px 0;border-top:1px solid #203b55}.tag{color:#35d39a;font-weight:800}.err{color:#ff9aa4;text-align:center}@media(max-width:700px){.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.search{flex-direction:column;gap:6px}.btn{height:50px}.metrics{grid-template-columns:1fr 1fr}}
</style>
<div class="wrap"><div class="nav"><div class="logo">SEO <b>Autopilot</b></div><div class="muted">AI SEO Growth Platform</div></div>
<section id="home" class="hero"><h1>اجعل موقعك <span>أقوى في البحث</span></h1><p>تحليل تقني مباشر واكتشاف فرص تحسين SEO في لوحة واحدة.</p><div class="search"><input id="url" value="https://example.com"><button class="btn" onclick="audit()">Analyze Website</button></div><div id="err" class="err"></div></section>
<section id="out" style="display:none"><div class="grid"><div class="card score"><div class="muted">SEO Health</div><div id="circle" class="circle"><div id="score">0</div></div><div id="summary" class="muted"></div></div><div class="card"><div class="muted">Website Overview</div><h2 id="site"></h2><div class="metrics"><div class="metric">Pages<b id="pages">0</b></div><div class="metric">Issues<b id="issuesCount">0</b></div><div class="metric">High<b id="high">0</b></div></div></div></div><div class="card"><h2>🚀 فرص التحسين</h2><div id="opps"></div></div><div class="card"><h2>⚠️ المشاكل المكتشفة</h2><div id="issues"></div></div><div class="card"><h2>📄 الصفحات</h2><div id="pageList"></div></div><button class="btn" onclick="location.reload()">تحليل موقع آخر</button></section></div>
<script>
async function audit(){const url=document.getElementById('url').value.trim();document.getElementById('err').textContent='جاري التحليل…';try{const r=await fetch('/api/audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(d.error)throw Error(d.error);render(d)}catch(e){document.getElementById('err').textContent='تعذر التحليل: '+e.message}}
function render(d){document.getElementById('home').style.display='none';document.getElementById('out').style.display='block';document.getElementById('score').textContent=d.score;document.getElementById('circle').style.setProperty('--score',d.score);document.getElementById('site').textContent=d.url;document.getElementById('pages').textContent=d.summary.pages;document.getElementById('issuesCount').textContent=d.summary.issues;document.getElementById('high').textContent=d.summary.high;document.getElementById('summary').textContent=d.summary.medium+' متوسطة · '+d.summary.low+' منخفضة';document.getElementById('opps').innerHTML=d.opportunities.map(x=>'<div class="row"><span class="tag">'+x.priority+'</span> <b>'+x.title+'</b><div class="muted">'+x.detail+'</div></div>').join('');document.getElementById('issues').innerHTML=d.issues.map(x=>'<div class="row"><b>'+x.severity.toUpperCase()+'</b> — '+x.message+'<div class="muted">'+x.url+'</div></div>').join('')||'<div class="muted">لا توجد مشاكل في العينة المفحوصة.</div>';document.getElementById('pageList').innerHTML=d.pages.map(x=>'<div class="row" dir="ltr">'+x.status+' — '+x.url+' · '+(x.words||0)+' words · '+(x.links||0)+' links</div>').join('')}
</script>
